# Application Name
spring.application.name=order-management-system

# Server Port (default is 8080)
server.port=8085

# Database Configuration
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ecommerce_db;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=Password1
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Show parameter values in SQL queries
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================
# LOGGING CONFIGURATION
# ============================================
# Log levels: TRACE < DEBUG < INFO < WARN < ERROR
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO
logging.level.com.ecommerce=DEBUG

# ============================================
# DEVELOPMENT SETTINGS
# ============================================
# Disable Thymeleaf cache for hot reload
spring.thymeleaf.cache=false
